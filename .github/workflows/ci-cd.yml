name: CI / CD

# Runs tests for PRs and builds + pushes Docker image on push to main.
# - Tests run for pull_request and push events.
# - On push to main: run tests, build Docker image and push to GitHub Container Registry (GHCR).
# - Optionally trigger Render deploy if you set RENDER_SERVICE_ID and RENDER_API_KEY in repo secrets.

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: 'Debug - print event info'
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, xml, zip, pcntl, exif
          ini-values: post_max_size=256M, memory_limit=1G

      - name: Get Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-suggest

      - name: Run tests
        run: composer run test --no-interaction

  build_and_push:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest

      - name: 'Debug - check Render secrets availability'
        if: always()
        run: |
          if [ -n "${{ secrets.RENDER_SERVICE_ID }}" ] && [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
            echo "Render secrets present: RENDER_SERVICE_ID is set, RENDER_API_KEY is set"
          else
            echo "Render secrets NOT set or empty. Skipping remote deploy step."
          fi

      - name: 'Optional - Trigger Render deploy'
        if: ${{ secrets.RENDER_SERVICE_ID != '' && secrets.RENDER_API_KEY != '' }}
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "Triggering Render deploy for service $RENDER_SERVICE_ID"
          HTTP_CODE=$(curl -s -o /tmp/render_resp -w "%{http_code}" -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\":true,\"commitHash\":\"${COMMIT}\"}")
          echo "Render API HTTP code: $HTTP_CODE"
          echo "Response body:" 
          cat /tmp/render_resp || true
          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Render deploy failed with HTTP code $HTTP_CODE"
            exit 1
          fi
